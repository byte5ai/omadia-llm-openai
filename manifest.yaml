schema_version: "1"

identity:
  id: "@omadia/plugin-llm-openai"
  name: "OpenAI (GPT) LLM Provider"
  version: "0.2.0"
  kind: "extension"
  domain: "llm.provider.openai"
  description: "Macht OpenAI (GPT-5.x-Familie) als admin-wählbaren, OpenAI-kompatiblen LLM-Provider in omadia verfügbar. Deklarativer Provider — wird aus diesem Manifest registriert, ohne Laufzeit-Provider-Code."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "llm-provider"
    - "infrastructure"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

# Declarative LLM-provider contribution. The kernel reads this block at
# manifest-load (before any plugin activates) and registers OpenAI into the
# LlmProviderCatalog + the dynamic model overlay. The API key is set centrally
# on the admin Providers page (vault key `provider:openai/api_key`), exactly
# like the built-in OpenAI provider — NOT via per-plugin setup secrets, because
# the orchestrator reads the key from its own (shared) vault scope.
llm_provider:
  id: "openai"
  label: "OpenAI"
  wire_format: "openai-compatible"
  default_base_url: "https://api.openai.com/v1"
  base_url_config_key: "openai_base_url"
  quirks:
    # GPT-5 / o-series reject the deprecated max_tokens — must send max_completion_tokens.
    max_tokens_field: "max_completion_tokens"
  # models is the offline seed; discovery rules must never name a version.
  # OpenAI lists only ids, so every rule supplies fallback capabilities.
  discovery:
    include:
      - "^gpt-\\d"
    exclude:
      - "(audio|realtime|transcribe|tts|whisper|image|dall-e|embedding|moderation|search|codex|instruct|computer-use|deep-research|chat-latest)"
      - "-pro$"
    classify:
      # The newest plain/sol generation defaults to frontier; older ones become balanced.
      - match: "^gpt-\\d+(\\.\\d+)?(-sol)?$"
        class: "frontier"
        rest_class: "balanced"
        max_tokens: 128000
        context_window: 400000
        vision: true
        effort_levels: ["low", "medium", "high", "xhigh"]
        effort_default: "medium"
      # Premium frontier follows plain/sol so it cannot take their class default.
      - match: "-astra$"
        class: "frontier"
        max_tokens: 128000
        context_window: 1000000
        vision: true
        effort_levels: ["low", "medium", "high", "xhigh"]
        effort_default: "medium"
      - match: "-(mini|terra)$"
        class: "balanced"
        max_tokens: 128000
        context_window: 400000
        vision: true
        effort_levels: ["low", "medium", "high", "xhigh"]
        effort_default: "medium"
      - match: "-(nano|luna)$"
        class: "fast"
        max_tokens: 128000
        context_window: 400000
        vision: true
        effort_levels: ["low", "medium", "high", "xhigh"]
        effort_default: "medium"
  models:
    - id: "openai:gpt-5.6-sol"
      model_id: "gpt-5.6-sol"
      label: "GPT-5.6 Sol"
      class: "frontier"
      max_tokens: 128000
      context_window: 1050000
      vision: true
      class_default: true
      effort_levels: ["low", "medium", "high", "xhigh"]
      effort_default: "medium"
    - id: "openai:gpt-6-astra"
      model_id: "gpt-6-astra"
      label: "GPT-6 Astra"
      class: "frontier"
      max_tokens: 128000
      context_window: 1050000
      vision: true
      effort_levels: ["low", "medium", "high", "xhigh"]
      effort_default: "medium"
    - id: "openai:gpt-5.6-terra"
      model_id: "gpt-5.6-terra"
      label: "GPT-5.6 Terra"
      class: "balanced"
      max_tokens: 128000
      context_window: 1050000
      vision: true
      effort_levels: ["low", "medium", "high", "xhigh"]
      effort_default: "medium"
    - id: "openai:gpt-5.6-luna"
      model_id: "gpt-5.6-luna"
      label: "GPT-5.6 Luna"
      class: "fast"
      max_tokens: 128000
      context_window: 1050000
      vision: true
      effort_levels: ["low", "medium", "high", "xhigh"]
      effort_default: "medium"

setup:
  fields:
    - key: "openai_base_url"
      type: "url"
      label: "OpenAI Base-URL"
      help: "Standard: https://api.openai.com/v1 — überschreiben für Azure/OpenAI-kompatible Gateways."
      required: false
      default: "https://api.openai.com/v1"

playbook:
  when_to_use: |
    Installiere diesen Provider, um OpenAI-Modelle (GPT-5.5 / GPT-5.4 /
    GPT-5.4 mini / GPT-5.4 nano) als Orchestrator-/Sub-Agent-/Verifier-LLM
    auszuwählen. Nach der Installation den API-Key auf der Admin-Providers-Seite
    hinterlegen und OpenAI dem gewünschten Plugin (z.B. Orchestrator) zuweisen.

permissions:
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    outbound:
      - "api.openai.com"
  filesystem:
    scratch: false

integrations: []
